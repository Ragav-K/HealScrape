<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HealScrape architecture</title>
<desc>A coding agent drives the Bright Data CLI to build, heal, and approve a Scraper Studio collector. That collector scrapes an npm package page and returns JSON. A downstream Node.js app triggers the same collector via the Bright Data API, prints the result, and appends it to a local history.json file.</desc>

<rect x="0" y="0" width="680" height="560" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
</marker>
</defs>

<g>
<rect x="230" y="40" width="220" height="56" rx="4" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="340" y="64" font-family="Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle">Coding agent</text>
<text x="340" y="82" font-family="Arial, sans-serif" font-size="12" fill="#444441" text-anchor="middle">bdata CLI (npx)</text>
</g>

<path d="M340,96 L340,138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="340" y="120" font-family="Arial, sans-serif" font-size="12" fill="#444441" text-anchor="middle">create &#8594; heal &#8594; approve</text>

<g>
<rect x="230" y="140" width="220" height="70" rx="4" fill="#EEEDFE" stroke="#7F77DD"/>
<text x="340" y="168" font-family="Arial, sans-serif" font-size="14" fill="#26215C" text-anchor="middle">Scraper Studio</text>
<text x="340" y="188" font-family="Arial, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle">Bright Data AI Flow</text>
</g>

<path d="M300,212 L300,268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="260" y="243" font-family="Arial, sans-serif" font-size="12" fill="#444441" text-anchor="end">GET page</text>

<path d="M380,268 L380,212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="420" y="243" font-family="Arial, sans-serif" font-size="12" fill="#444441" text-anchor="start">HTML</text>

<g>
<rect x="230" y="270" width="220" height="56" rx="4" fill="#FAECE7" stroke="#F0997B"/>
<text x="340" y="294" font-family="Arial, sans-serif" font-size="14" fill="#4A1B0C" text-anchor="middle">npm package page</text>
<text x="340" y="312" font-family="Arial, sans-serif" font-size="12" fill="#712B13" text-anchor="middle">external target site</text>
</g>

<path d="M340,326 L340,368" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="340" y="352" font-family="Arial, sans-serif" font-size="12" fill="#444441" text-anchor="middle">JSON (4 fields)</text>

<g>
<rect x="230" y="370" width="220" height="56" rx="4" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="340" y="394" font-family="Arial, sans-serif" font-size="14" fill="#04342C" text-anchor="middle">Downstream app</text>
<text x="340" y="412" font-family="Arial, sans-serif" font-size="12" fill="#085041" text-anchor="middle">Node.js, zero deps</text>
</g>

<path d="M340,426 L340,468" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="340" y="452" font-family="Arial, sans-serif" font-size="12" fill="#444441" text-anchor="middle">append run</text>

<g>
<rect x="230" y="470" width="220" height="50" rx="4" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="340" y="492" font-family="Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="middle">history.json</text>
<text x="340" y="509" font-family="Arial, sans-serif" font-size="12" fill="#444441" text-anchor="middle">local run log</text>
</g>
</svg>
